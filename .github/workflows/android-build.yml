name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calendario-magico-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish debug APK to a stable release
        if: success() && github.ref == 'refs/heads/claude/shared-calendar-android-app-ipxbz5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-apk
          name: "Calendário Mágico — última build de testes (debug)"
          body: |
            APK de debug gerado automaticamente a partir do último commit em `${{ github.ref_name }}` (${{ github.sha }}).

            ⚠️ Antes de instalar, substitui `app/google-services.json` pelo ficheiro real do teu projeto Firebase — sem isso, a sincronização entre dispositivos não funciona.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
